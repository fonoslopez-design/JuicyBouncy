const params = new URLSearchParams(window.location.search);
const selectedProduct = params.get("product");
if (!selectedProduct || !products[selectedProduct]) { window.location.href = "shop.html"; }
const product = products[selectedProduct];
document.getElementById("productName").textContent = selectedProduct;
document.getElementById("productPrice").textContent = "$" + product.price;
document.getElementById("productInput").value = selectedProduct;
document.getElementById("priceInput").value = "$" + product.price;
if (product.paypal) { document.getElementById("paypalRedirect").value = product.paypal; }
// Option picker: the 4 variants of this flavor (individual/mold x online/in-store).
(function () {
  var base = selectedProduct.indexOf("Molde de ") === 0 ? selectedProduct.slice(9) : selectedProduct.replace(/ Individual$/, "");
  var ind = base + " Individual", mold = "Molde de " + base;
  var here = window.location.pathname.indexOf("store-checkout.html") !== -1 ? "store-checkout.html" : "checkout.html";
  var opts = [
    { page: "checkout.html", product: ind, label: "Individual \u00b7 En l\u00ednea $" + products[ind].price },
    { page: "checkout.html", product: mold, label: "Molde \u00b7 En l\u00ednea $" + products[mold].price },
    { page: "store-checkout.html", product: ind, label: "Individual \u00b7 En tienda $" + products[ind].price },
    { page: "store-checkout.html", product: mold, label: "Molde \u00b7 En tienda $" + products[mold].price }
  ];
  var html = "";
  opts.forEach(function (o) {
    var cur = (o.page === here && o.product === selectedProduct);
    html += '<a class="btn" href="' + o.page + '?product=' + encodeURIComponent(o.product) + '&price=' + products[o.product].price + '">' + (cur ? "\u2713 " : "") + o.label + '</a>';
  });
  document.getElementById("optionButtons").innerHTML = html;
})();
